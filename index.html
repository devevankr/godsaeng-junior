<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GodSaeng Junior - 16 Personas Matrix</title>
    <link rel="icon" href="https://fav.farm/🌱">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #f1f5f9; color: #0f172a; -webkit-font-smoothing: antialiased; }
        .insta-card { background: #ffffff; border-radius: 2.5rem; border: 1px solid #e2e8f0; }
        input[type="radio"]:checked + label { border-color: #0f172a; background-color: #f8fafc; box-shadow: 0 0 0 1px #0f172a; }
        #captureArea { background: white; padding: 24px; border-radius: 40px; }
        .hidden { display: none; }
    </style>
</head>
<body class="py-12 px-4 flex flex-col items-center">

    <div class="max-w-md w-full">
        <header class="text-center mb-10">
            <h1 class="text-4xl font-black text-slate-900 mb-2 tracking-tighter">GodSaeng Junior</h1>
            <p id="subHeader" class="text-slate-500 text-sm font-semibold italic">16 Types of Persona Analysis</p>
        </header>

        <div id="inputForm" class="bg-white p-8 rounded-[2.5rem] shadow-sm mb-8 border border-slate-100">
            <div class="space-y-7">
                <div>
                    <label class="text-[11px] font-black text-slate-400 ml-1 uppercase tracking-widest">Child's Name</label>
                    <input type="text" id="name" placeholder="아이 이름을 적어주세요" class="w-full px-5 py-4 bg-slate-50 rounded-2xl outline-none focus:ring-2 focus:ring-slate-900 mt-1 text-[16px] font-medium">
                </div>
                
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1">
                        <label class="text-[11px] font-black text-slate-400 ml-1 uppercase tracking-widest">Height (cm)</label>
                        <input type="number" id="h" value="95" class="w-full px-5 py-4 bg-slate-50 rounded-2xl outline-none font-bold text-[16px]">
                    </div>
                    <div class="space-y-1">
                        <label class="text-[11px] font-black text-slate-400 ml-1 uppercase tracking-widest">Weight (kg)</label>
                        <input type="number" id="w" value="14" class="w-full px-5 py-4 bg-slate-50 rounded-2xl outline-none font-bold text-[16px]">
                    </div>
                </div>

                <div>
                    <label class="text-[11px] font-black text-slate-400 mb-4 block ml-1 uppercase tracking-widest">요즘 우리 아이는?</label>
                    <div class="space-y-3">
                        <input type="radio" name="trait" id="eat" value="eat" class="hidden" checked>
                        <label for="eat" class="flex flex-col p-4 border border-slate-200 rounded-2xl cursor-pointer hover:bg-slate-50 transition-all">
                            <span class="text-[14px] font-bold">🍕 수저만 들면 입을 "아~" 벌려요</span>
                            <span class="text-[11px] text-slate-500 mt-1 font-medium">먹는 게 제일 즐거운 세상 행복한 미식가</span>
                        </label>
                        
                        <input type="radio" name="trait" id="active" value="active" class="hidden">
                        <label for="active" class="flex flex-col p-4 border border-slate-200 rounded-2xl cursor-pointer hover:bg-slate-50 transition-all">
                            <span class="text-[14px] font-bold">⚡ 낮잠도 잊은 채 온 집안을 뛰어요</span>
                            <span class="text-[11px] text-slate-500 mt-1 font-medium">지치지 않는 무한 체력의 에너자이저</span>
                        </label>
                        
                        <input type="radio" name="trait" id="smart" value="smart" class="hidden">
                        <label for="smart" class="flex flex-col p-4 border border-slate-200 rounded-2xl cursor-pointer hover:bg-slate-50 transition-all">
                            <span class="text-[14px] font-bold">🎓 개미 한 마리도 뚫어지게 봐요</span>
                            <span class="text-[11px] text-slate-500 mt-1 font-medium">궁금한 건 못 참는 집중력 만렙 탐구왕</span>
                        </label>
                        
                        <input type="radio" name="trait" id="social" value="social" class="hidden">
                        <label for="social" class="flex flex-col p-4 border border-slate-200 rounded-2xl cursor-pointer hover:bg-slate-50 transition-all">
                            <span class="text-[14px] font-bold">😊 사람을 보면 먼저 방긋 웃어요</span>
                            <span class="text-[11px] text-slate-500 mt-1 font-medium">낯가림 제로, 어디서든 사랑받는 동네 스타</span>
                        </label>
                    </div>
                </div>

                <button onclick="analyzeData()" class="w-full bg-slate-900 text-white font-black py-5 rounded-2xl shadow-xl hover:bg-slate-800 active:scale-95 transition-all text-lg">
                    결과 확인하기
                </button>
            </div>
        </div>

        <div id="resultArea" class="hidden space-y-4">
            <div id="captureArea" class="insta-card overflow-hidden border-none shadow-2xl">
                <div id="visualBox" class="aspect-square rounded-[2.5rem] mb-6 flex flex-col items-center justify-center relative transition-all duration-1000">
                    <div id="personaIcon" class="text-[110px] mb-2 drop-shadow-lg"></div>
                    <div id="tagContainer" class="flex flex-wrap justify-center gap-2 px-4"></div>
                </div>
                <div class="px-3 text-center">
                    <p id="analysisSummary" class="text-[10px] font-black text-slate-400 mb-2 uppercase tracking-[0.25em]"></p>
                    <h2 id="personaTitle" class="text-3xl font-black text-slate-900 mb-6 tracking-tight"></h2>
                    <div class="text-left bg-slate-50 p-6 rounded-[2rem] border border-slate-100 mb-6">
                        <p id="guideText" class="text-[14px] leading-relaxed text-slate-600 font-medium"></p>
                    </div>
                    <p class="text-[10px] text-slate-300 font-bold mb-3 tracking-tighter uppercase font-mono">Verified by GodSaeng Junior</p>
                </div>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <button onclick="downloadCard()" class="bg-white border-2 border-slate-900 text-slate-900 font-bold py-4 rounded-2xl">📥 저장</button>
                <button onclick="shareLink()" class="bg-blue-600 text-white font-bold py-4 rounded-2xl shadow-lg">🔗 공유</button>
            </div>
            <button onclick="location.href=window.location.pathname" class="w-full text-slate-400 text-[13px] font-bold py-4 underline">새로운 아이 진단하기</button>
        </div>
    </div>

    <script>
        // 16가지 페르소나 데이터베이스
        const personaMatrix = {
            tall: {
                eat: { title: "모델 포스 먹방러", icon: "🦒", color: "bg-indigo-50", summary: "우월한 기럭지와 영양 흡수력", tags: ["#성장판풀개방", "#모델식단"], guide: "키가 크면서 잘 먹는 아이는 성장에 에너지를 많이 씁니다. <b>고칼슘 보충제</b>와 <b>스트레칭 교구</b>를 추천해요!" },
                active: { title: "기럭지 만렙 운동선수", icon: "🏀", color: "bg-blue-50", summary: "압도적 피지컬과 활동량", tags: ["#미래의NBA", "#활동량최고"], guide: "긴 다리로 활발하게 움직이는 시기입니다. <b>주니어 전용 스포츠웨어</b>와 <b>야외 풋살장</b> 체험은 어떨까요?" },
                smart: { title: "스마트한 꺽다리 박사", icon: "🎓", color: "bg-cyan-50", summary: "큰 체구와 고도의 집중력", tags: ["#상위5%기럭지", "#꼬마박사"], guide: "피지컬과 지적 능력이 조화롭게 발달 중입니다. <b>대형 퍼즐</b>이나 <b>창의 과학 키트</b>를 추천합니다." },
                social: { title: "인기 폭발 톨앤핸섬", icon: "🌟", color: "bg-purple-50", summary: "우월한 비율과 뛰어난 사교성", tags: ["#비주얼센터", "#인싸의정석"], guide: "어디서나 눈에 띄는 존재감을 발휘합니다. <b>가족 동반 키즈 펜션</b>에서 사회성을 더 키워주세요." }
            },
            mochi: {
                eat: { title: "완밥 대장 볼살 요정", icon: "🥯", color: "bg-orange-50", summary: "BMI 상위권의 영양 대장", tags: ["#볼살매력", "#완밥인증"], guide: "먹는 것이 곧 행복인 아이네요! <b>자기주도 식기 세트</b>와 <b>저당 영양 간식</b>을 챙겨주세요." },
                active: { title: "에너지 넘치는 천하장사", icon: "🐘", color: "bg-yellow-50", summary: "단단한 골격과 무한 파워", tags: ["#파워에너자이저", "#힘이장사"], guide: "힘이 넘치는 활동가입니다. 에너지를 마음껏 쏟을 수 있는 <b>대형 키즈카페 이용권</b>을 선물하세요." },
                smart: { title: "호기심 많은 곰돌이", icon: "🧸", color: "bg-stone-50", summary: "푸근한 기질과 깊은 탐구력", tags: ["#푸근한매력", "#관찰력만렙"], guide: "차분하게 하나를 뚫어지게 보는 아이입니다. <b>정서 발달용 입체 북</b>과 <b>동물 체험 농장</b>을 추천합니다." },
                social: { title: "듬직한 동네 대장님", icon: "🦁", color: "bg-amber-50", summary: "듬직한 체구와 리더십", tags: ["#골목대장", "#인기쟁이"], guide: "친구들 사이에서 리더십을 발휘하는 스타일입니다. <b>다인용 보드게임</b>과 <b>공동 육아 프로그램</b>을 경험해보세요." }
            },
            slim: {
                eat: { title: "입 짧은 슬림 미식가", icon: "🍗", color: "bg-rose-50", summary: "높은 연소율과 미식 취향", tags: ["#연소천재", "#조금씩자주"], guide: "에너지 소모가 빨라 살이 안 찌는 타입입니다. <b>고단백 밀키트</b>로 조금씩 영양을 보충해주세요." },
                active: { title: "날쌘돌이 다람쥐", icon: "🐿️", color: "bg-red-50", summary: "가벼운 몸놀림과 빠른 순발력", tags: ["#스피드왕", "#날쌘돌이"], guide: "몸이 가볍고 민첩합니다. <b>유아용 밸런스 바이크</b>와 <b>안전한 헬멧 세트</b>를 강력 추천합니다." },
                smart: { title: "섬세한 꼬마 전략가", icon: "🔍", color: "bg-teal-50", summary: "예민한 감각과 영리한 두뇌", tags: ["#브레인주니어", "#디테일장인"], guide: "섬세한 감각을 지닌 아이입니다. <b>코딩 블록 교구</b>나 <b>정밀한 드로잉 매트</b>로 집중력을 높여주세요." },
                social: { title: "수줍은 미소 천사", icon: "👼", color: "bg-pink-50", summary: "슬림한 체격과 따뜻한 공감력", tags: ["#요정미모", "#공감천재"], guide: "상대방의 기분을 잘 살피는 아이입니다. <b>정서 교감 인형</b>이나 <b>홈파티 세트</b>로 따뜻한 시간을 보내세요." }
            },
            standard: {
                eat: { title: "골든 갓생 꿈나무", icon: "🌱", color: "bg-emerald-50", summary: "완벽한 성장 밸런스와 식습관", tags: ["#표준의정석", "#건강한성장"], guide: "모든 지표가 이상적입니다. <b>성장 기록 다이어리</b>와 <b>피크닉 런치박스</b>를 준비해보세요." },
                active: { title: "루틴 요정 에너자이저", icon: "⚡", color: "bg-lime-50", summary: "규칙적인 활동과 성실한 에너지", tags: ["#갓생루틴", "#바른생활"], guide: "일정한 루틴으로 활동하는 아이입니다. <b>스케줄링 보드</b>와 <b>운동화 건조기</b>가 육아 도우미가 될 거예요." },
                smart: { title: "집중력 만렙 꿈나무", icon: "📖", color: "bg-slate-50", summary: "균형 잡힌 신체와 지적 발달", tags: ["#모범생포스", "#집중의시간"], guide: "지적 호기심이 매우 높습니다. <b>어린이 백과사전 세트</b>와 <b>학습용 책상 세트</b>를 검토해보세요." },
                social: { title: "예의 바른 갓생 인싸", icon: "🤝", color: "bg-zinc-50", summary: "바른 성품과 조화로운 사교성", tags: ["#매너가사람을", "#성격미남미녀"], guide: "예의 바르고 조화로운 아이입니다. <b>예절 교육 동화책</b>과 <b>어린이 연극 관람</b>을 제안합니다." }
            }
        };

        function analyzeData() {
            const name = document.getElementById('name').value || '주니어';
            const h = parseFloat(document.getElementById('h').value);
            const w = parseFloat(document.getElementById('w').value);
            const trait = document.querySelector('input[name="trait"]:checked').value;
            
            const bmi = w / ((h/100) * (h/100));
            const standardH = 95;
            
            let bodyType = "standard";
            if (h > standardH + 6) bodyType = "tall";
            else if (bmi > 17.5) bodyType = "mochi";
            else if (bmi < 14.5) bodyType = "slim";

            const res = personaMatrix[bodyType][trait];

            document.getElementById('inputForm').classList.add('hidden');
            document.getElementById('resultArea').classList.remove('hidden');
            document.getElementById('personaTitle').innerText = `${name}는 '${res.title}'`;
            document.getElementById('personaIcon').innerText = res.icon;
            document.getElementById('analysisSummary').innerText = res.summary;
            document.getElementById('visualBox').className = `aspect-square rounded-[2.5rem] mb-6 flex flex-col items-center justify-center relative ${res.color}`;
            document.getElementById('guideText').innerHTML = res.guide;

            const tagContainer = document.getElementById('tagContainer');
            tagContainer.innerHTML = '';
            res.tags.forEach(tag => {
                const span = document.createElement('span');
                span.className = "bg-white/90 backdrop-blur px-4 py-2 rounded-full text-[11px] font-black shadow-sm text-slate-800 border border-slate-100";
                span.innerText = tag;
                tagContainer.appendChild(span);
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function shareLink() {
            const url = new URL(window.location.href);
            url.searchParams.set('name', document.getElementById('name').value);
            url.searchParams.set('h', document.getElementById('h').value);
            url.searchParams.set('w', document.getElementById('w').value);
            url.searchParams.set('trait', document.querySelector('input[name="trait"]:checked').value);
            
            if (navigator.share) {
                await navigator.share({ title: 'GodSaeng Junior 진단 결과', url: url.href });
            } else {
                await navigator.clipboard.writeText(url.href);
                alert('공유 링크가 클립보드에 복사되었습니다!');
            }
        }

        function downloadCard() {
            html2canvas(document.getElementById('captureArea'), { scale: 2, backgroundColor: "#ffffff" }).then(canvas => {
                const link = document.createElement('a');
                link.download = `GodSaeng_Junior_Card.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        window.onload = function() {
            const params = new URLSearchParams(window.location.search);
            if (params.has('name')) {
                document.getElementById('name').value = params.get('name');
                document.getElementById('h').value = params.get('h');
                document.getElementById('w').value = params.get('w');
                const t = params.get('trait');
                if(document.getElementById(t)) document.getElementById(t).checked = true;
                analyzeData();
            }
        }
    </script>
</body>
</html>
